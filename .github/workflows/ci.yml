name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Syntax-check every backend file
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f"
          done

      - name: Syntax-check every frontend file
        working-directory: frontend
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f"
          done

      - name: Seed the database
        run: node utils/seed.js

      - name: Boot the server and check health
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "Server is up"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:4000/api/health || (echo "Health check failed" && exit 1)
          curl -sf -X POST http://localhost:4000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123"}' | grep -q token || (echo "Login failed" && exit 1)
          kill $SERVER_PID
